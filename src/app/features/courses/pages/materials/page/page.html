<div class="flex items-center gap-1 text-sm text-gray-500 mb-6">
    <a routerLink="../../.." class="hover:text-primary transition-colors flex items-center gap-1">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Materials
    </a>
    <span class="text-gray-300">/</span>
    <span class="text-gray-900 font-medium truncate max-w-[200px]">Course Syllabus</span>
</div>

<div class="bg-white rounded-2xl border border-gray-100 flex flex-col h-[calc(100vh-180px)] min-h-[500px]">
    <div class="p-4 border-b border-gray-100 flex items-center justify-between">
         <div class="flex items-center gap-3">
              <h1 class="text-lg font-bold text-gray-900">Course Syllabus</h1>
         </div>
         <div class="flex items-center gap-2">
             <button class="btn outline">Preview</button>
             <button class="btn primary">Save Changes</button>
         </div>
    </div>
    
    <!-- Toolbar placeholder to simulate editor -->
    <div class="p-2 border-b border-gray-100 bg-gray-100 flex items-center gap-2">
         <div class="flex items-center gap-1 px-2 border-r border-gray-200">
             <button class="p-1.5 text-gray-500 hover:bg-gray-200 rounded"><span class="font-bold">B</span></button>
             <button class="p-1.5 text-gray-500 hover:bg-gray-200 rounded"><span class="italic">I</span></button>
             <button class="p-1.5 text-gray-500 hover:bg-gray-200 rounded"><span class="underline">U</span></button>
         </div>
         <div class="flex items-center gap-1 px-2 border-r border-gray-200">
             <button class="p-1.5 text-gray-500 hover:bg-gray-200 rounded">
                 <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
             </button>
             <button class="p-1.5 text-gray-500 hover:bg-gray-200 rounded">
                 <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="6" x2="21" y2="6"></line><line x1="10" y1="12" x2="21" y2="12"></line><line x1="10" y1="18" x2="21" y2="18"></line><path d="M4 6h1v4"></path><path d="M4 10h2"></path><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"></path></svg>
             </button>
         </div>
    </div>

    <!-- Textarea acting as placeholder for WYSIWYG editor -->
    <div class="flex-1 flex flex-col">
         <textarea class="form-control resize-none w-full h-full text-base p-4 border-transparent! outline-none! ring-0!" placeholder="Start writing your page content here...">Welcome to the course! Here is the syllabus...</textarea>
    </div>
</div>
