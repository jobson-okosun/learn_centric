<div class="bg-white p-6 rounded-2xl border border-gray-100 flex flex-col gap-6">
    <div class="flex items-center justify-between mb-2 pb-6 border-b border-gray-100">
        <div>
            <h1 class="text-lg font-bold text-gray-900">Questions</h1>
            <p class="text-sm text-gray-500 mt-1">Total Points: 6</p>
        </div>
        <button class="btn primary px-5 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Add Question
        </button>
    </div>

    <div class="flex flex-col gap-6">
        @for (q of questions(); track q.id; let i = $index) {
            <div class="border border-gray-100 rounded-2xl p-3">
                
                <div class="flex items-start justify-between mb-8">
                    <div class="flex flex-col gap-1.5">
                        <div class="flex items-center gap-3">
                            <h2 class="text-lg font-bold text-gray-900">Question {{i + 1}}</h2>
                        </div>
                        <div class="text-sm font-medium text-gray-500">{{q.points}} Points</div>
                    </div>

                    <!-- Dropdown Menu -->
                    <button zDropdown [zDropdownMenu]="questionMenu" class="p-2 text-gray-400 hover:text-gray-900 rounded-lg hover:bg-gray-100 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
                    </button>

                    <z-dropdown-menu-content #questionMenu="zDropdownMenuContent" zAlign="end" class="w-48">
                        <z-dropdown-menu-item>
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
                            Edit Question
                        </z-dropdown-menu-item>
                        <z-dropdown-menu-separator></z-dropdown-menu-separator>
                        <z-dropdown-menu-item class="text-red-600 focus:text-red-600 focus:bg-red-50">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            Remove
                        </z-dropdown-menu-item>
                    </z-dropdown-menu-content>
                </div>

                <div class="text-[15px] text-gray-800 mb-6 leading-relaxed">
                    {{q.stem}}
                </div>

                @if (q.options) {
                    <div class="space-y-3">
                        @for (opt of q.options; track opt.id; let optIdx = $index) {
                            <label class="flex items-center gap-4 p-4 rounded-xl border border-gray-200 cursor-pointer hover:border-primary/50 hover:bg-primary/5 transition-colors group">
                                <input type="radio" [name]="'q_' + q.id" [value]="opt.id" class="size-5 accent-primary border-gray-300">
                                <span class="text-gray-700 group-hover:text-gray-900 font-medium">{{opt.text}}</span>
                            </label>
                        }
                    </div>
                }
            </div>
        }
    </div>
</div>
