<div class="h-[calc(100vh-40px)] flex flex-col p-1">
    <div class="flex items-center justify-between px-6 py-1 bg-white">
        <div>
            <h2 class="text-xl font-bold text-gray-900">Create Question</h2>
            <p class="text-sm text-gray-500 mt-0.5 font-medium">Select a question format to begin authoring.</p>
        </div>
        
        <div class="flex items-center gap-3 pr-14">
            <!-- Preview Toggle -->
            <div class="flex items-center gap-2 cursor-pointer" (click)="previewMode.set(!previewMode())">
                <span class="text-xs font-semibold text-gray-700 select-none">Preview Mode</span>
                <z-switch [(zChecked)]="previewMode" (click)="$event.stopPropagation()"></z-switch>
            </div>
            
            <div class="w-px h-6 bg-gray-200"></div>
            
            <!-- Save Button -->
            <div class="flex items-center">
                <button zDropdown [zDropdownMenu]="saveMenu" class="btn primary px-5 flex items-center gap-2">
                    Save
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="size-3.5"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" /></svg>
                </button>
                
                <z-dropdown-menu-content #saveMenu="zDropdownMenuContent" [zSide]="'bottom'" [zAlign]="'end'" class="w-48 text-left">
                    <z-dropdown-menu-item>
                        <span class="flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
                            Save
                        </span>
                    </z-dropdown-menu-item>
                    <z-dropdown-menu-item>
                        <span class="flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                            Save to Draft
                        </span>
                    </z-dropdown-menu-item>
                </z-dropdown-menu-content>
            </div>
        </div>
    </div>

    <div class="flex-1 flex gap-4 p-2 bg-[#F5F5F5] rounded-2xl overflow-hidden">
        
        <div class="rounded-2xl bg-white flex-1 flex flex-col overflow-hidden max-w-[300px]">
            
            <div class="p-4 space-y-4 border-b border-gray-100 shrink-0">
                <div class="w-full">
                    <z-combobox 
                        class="w-full font-medium" 
                        [options]="categoryOptions()" 
                        [zValue]="selectedCategory()?.id || ''"
                        (zValueChange)="onCategoryChange($event)">
                    </z-combobox>
                </div>
            </div>

            <div class="flex-1 flex flex-col overflow-y-auto p-4 gap-4 no-scrollbar bg-white">
                @if (selectedCategory()) {
                    @for (qType of selectedCategory()!.questionTypes; track qType.code) {
                        <div (click)="onQuestionTypeChange(qType)"
                             [class]="selectedQuestionType()?.code === qType.code ? 'border-primary bg-primary/5' : 'border-gray-200 bg-white hover:border-gray-300 hover:bg-gray-50/50'"
                             class="rounded-xl h-40 w-full flex flex-col border overflow-hidden shrink-0 cursor-pointer transition-all relative group">
                            
                            @if (selectedQuestionType()?.code === qType.code) {
                                <div class="absolute top-3 right-3 w-6 h-6 bg-primary rounded-full flex items-center justify-center text-white z-20">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="w-3.5 h-3.5"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" /></svg>
                                </div>
                            }

                            <div class="font-extrabold text-[15px] text-gray-800 pt-4 px-4 pb-3 shrink-0 tracking-tight z-10 text-center">
                                {{ qType.name }}
                            </div>
                            
                            <div class="flex justify-center flex-1 min-h-0 overflow-hidden px-4 pb-4">
                                <div class="w-full bg-white rounded-lg h-full flex flex-col min-h-0 relative border border-gray-200/60">
                                    <app-question-type-preview [type]="qType.code"></app-question-type-preview>
                                </div>
                            </div>
                        </div>
                    }
                }
            </div>
        </div>

        <div class="rounded-2xl bg-white flex flex-col overflow-hidden flex-1 min-h-0">
            <app-author-manager [questionType]="selectedQuestionType()?.code" [previewMode]="previewMode()" class="flex flex-col flex-1 min-h-0 h-full w-full"></app-author-manager>
        </div>
    </div>
</div>
