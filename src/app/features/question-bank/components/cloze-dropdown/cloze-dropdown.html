<div class="flex flex-col gap-6 p-6">
    <div>
        <h3 class="text-sm font-bold text-gray-900">Fill in the Blanks (Dropdown)</h3>
        <p class="text-[13px] text-gray-500 mt-1">Configuration for this question type is handled directly inside the rich text editor above. Use the <strong class="text-gray-700">[...]</strong> icon in the toolbar to insert blanks.</p>
    </div>
    
    <!-- Settings Section (Full Width) -->
    <div class="bg-gray-100 border border-gray-200 rounded-2xl p-5 flex flex-col gap-4">
        <div class="flex items-center justify-between border-b border-gray-200 pb-3">
            <label class="text-[14px] text-gray-900 font-bold">Settings</label>
        </div>
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="flex flex-col gap-1.5">
                <label class="text-[12px] text-gray-500 font-medium">Score</label>
                <input [(ngModel)]="score" type="number" min="0" class="w-full border border-gray-300 rounded-lg p-2 text-[13px] bg-white outline-none focus:border-primary transition-all" />
            </div>
            <div class="flex flex-col gap-1.5">
                <label class="text-[12px] text-gray-500 font-medium">Penalty</label>
                <input [(ngModel)]="penalty" type="number" min="0" class="w-full border border-gray-300 rounded-lg p-2 text-[13px] bg-white outline-none focus:border-primary transition-all" />
            </div>
            <div class="flex flex-col gap-1.5">
                <label class="text-[12px] text-gray-500 font-medium">Scoring Type</label>
                <select [(ngModel)]="scoringType" class="w-full border border-gray-300 rounded-lg p-2 text-[13px] bg-white text-gray-700 outline-none focus:border-primary transition-all cursor-pointer">
                    @for(item of scoringTypes; track $index) {
                        <option [value]="item">{{ item.replaceAll('_', ' ') }}</option>
                    }
                </select>
            </div>
            <div class="flex flex-col gap-1.5">
                <label class="text-[12px] text-gray-500 font-medium">Matching Rule</label>
                <select [(ngModel)]="matchingRule" class="w-full border border-gray-300 rounded-lg p-2 text-[13px] bg-white text-gray-700 outline-none focus:border-primary transition-all cursor-pointer">
                    @for(item of matchingRules; track $index) {
                        <option [value]="item">{{ item.replaceAll('_', ' ') }}</option>
                    }
                </select>
            </div>
            <div class="flex flex-col gap-1.5 col-span-2">
                <label class="text-[12px] text-gray-500 font-medium">Difficulty level</label>
                <select [(ngModel)]="difficultyLevel" class="w-full border border-gray-300 rounded-lg p-2 text-[13px] bg-white text-gray-700 outline-none focus:border-primary transition-all cursor-pointer capitalize">
                    @for(item of difficultyLevels; track $index) {
                        <option [value]="item">{{ item }}</option>
                    }
                </select>
            </div>
            <div class="flex items-center gap-3 col-span-2 mt-auto pb-1">
                <span class="text-[12px] text-gray-700 font-medium">Auto Score</span>
                <z-switch [(zChecked)]="autoScore"></z-switch>
            </div>
        </div>
    </div>
</div>
