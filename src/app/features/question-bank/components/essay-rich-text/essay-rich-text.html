<div class="grid grid-cols-1 lg:grid-cols-5 gap-6 p-6">
    <!-- Configuration Column -->
    <div class="lg:col-span-3 flex flex-col gap-6">
        <div>
            <h3 class="text-sm font-bold text-gray-900">Essay (Rich Text) Settings</h3>
            <p class="text-[13px] text-gray-500 font-medium">Configure constraints for the student's rich text response.</p>
        </div>
        
        <div class="bg-gray-50 border border-gray-200 rounded-2xl p-5 grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Limits -->
            <div class="flex flex-col gap-5">
                <h4 class="text-[13px] font-semibold text-gray-900 pb-2 border-b border-gray-200">Length Limits</h4>
                
                <div class="flex flex-col gap-2">
                    <label class="text-[12px] font-semibold text-gray-700">Max Words (Optional)</label>
                    <input 
                        [(ngModel)]="maxWords" 
                        type="number" min="1"
                        class="w-full border border-gray-300 rounded-lg p-2 text-[13px] bg-white outline-none focus:border-primary transition-all" 
                        placeholder="e.g. 500" />
                    <span class="text-[10px] text-gray-500 font-medium">Leave empty for unlimited.</span>
                </div>
                
                <div class="flex flex-col gap-2">
                    <label class="text-[12px] font-semibold text-gray-700">Max Characters (Optional)</label>
                    <input 
                        [(ngModel)]="maxLength" 
                        type="number" min="1"
                        class="w-full border border-gray-300 rounded-lg p-2 text-[13px] bg-white outline-none focus:border-primary transition-all" 
                        placeholder="e.g. 2000" />
                    <span class="text-[10px] text-gray-500 font-medium">Leave empty for unlimited.</span>
                </div>
            </div>

            <!-- Restrictions -->
            <div class="flex flex-col gap-5">
                <h4 class="text-[13px] font-semibold text-gray-900 pb-2 border-b border-gray-200">Restrictions</h4>
                
                <div class="flex items-center justify-between mt-1">
                    <span class="text-[12px] text-gray-700 font-semibold">Allow Copy</span>
                    <z-switch [(zChecked)]="allowCopy"></z-switch>
                </div>
                
                <div class="flex items-center justify-between">
                    <span class="text-[12px] text-gray-700 font-semibold">Allow Paste</span>
                    <z-switch [(zChecked)]="allowPaste"></z-switch>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Settings Column -->
    <div class="lg:col-span-2 bg-gray-100 border border-gray-200 rounded-2xl p-5 flex flex-col gap-4 h-fit">
        <div class="flex items-center justify-between border-b border-gray-200 pb-3">
            <label class="text-[14px] text-gray-900 font-bold">Settings</label>
        </div>
        
        <div class="grid grid-cols-2 gap-4">
            <div class="flex flex-col gap-1.5">
                <label class="text-[12px] text-gray-500 font-medium">Score</label>
                <input [(ngModel)]="score" type="number" min="0" class="w-full border border-gray-300 rounded-lg p-2 text-[13px] bg-white outline-none focus:border-primary transition-all" />
            </div>
            <div class="flex flex-col gap-1.5">
                <label class="text-[12px] text-gray-500 font-medium">Penalty</label>
                <input [(ngModel)]="penalty" type="number" min="0" class="w-full border border-gray-300 rounded-lg p-2 text-[13px] bg-white outline-none focus:border-primary transition-all" />
            </div>
            <div class="flex flex-col gap-1.5 col-span-full">
                <label class="text-[12px] text-gray-500 font-medium">Difficulty level</label>
                <select [(ngModel)]="difficultyLevel" class="w-full border border-gray-300 rounded-lg p-2 text-[13px] bg-white text-gray-700 outline-none focus:border-primary transition-all cursor-pointer capitalize">
                    @for(item of difficultyLevels; track $index) {
                        <option [value]="item">{{ item }}</option>
                    }
                </select>
            </div>
        </div>
    </div>
</div>
