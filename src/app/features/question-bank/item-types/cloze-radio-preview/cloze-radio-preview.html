<div class="border border-gray-200 rounded-2xl p-3">
    <div class="flex items-start justify-between mb-8">
        <div class="flex flex-col gap-1.5">
            <div class="flex items-center gap-3">
                <h2 class="text-lg font-bold text-gray-900">Question {{index() + 1}}</h2>
            </div>
            <div class="text-sm font-medium text-gray-500">{{question().points}} Points</div>
        </div>
        
        <button zDropdown [zDropdownMenu]="questionMenu" class="p-2 text-gray-400 hover:text-gray-900 rounded-lg hover:bg-gray-100 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
        </button>
        
        <z-dropdown-menu-content #questionMenu="zDropdownMenuContent" zAlign="end" class="w-48">
            <z-dropdown-menu-item>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
                Edit
            </z-dropdown-menu-item>
            <z-dropdown-menu-item class="text-red-600 focus:text-red-600 focus:bg-red-50">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" class="mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                Delete
            </z-dropdown-menu-item>
        </z-dropdown-menu-content>
    </div>

    <!-- Inline radio preview using standard [innerHTML] -->
    <div class="text-[15px] text-gray-800 leading-relaxed bg-gray-50 rounded-xl p-4 prose max-w-none" [innerHTML]="question().stem"></div>
</div>
