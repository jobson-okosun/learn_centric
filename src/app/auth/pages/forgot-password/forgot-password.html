<div class="flex flex-col items-center w-full">
    <h2 class="text-[32px] font-black text-slate-700 text-center mb-1">Reset password</h2>
    <p class="text-[14px] text-gray-500 mb-8 font-medium text-center">Enter your email and we'll send a link to reset.</p>

    <form class="w-full flex flex-col gap-5">
        
        <div class="form-group gap-1.5 p-0">
            <label for="email" class="text-[11px] font-bold text-gray-700 ml-1 uppercase tracking-wider">Email</label>
            <input type="email" id="email" class="form-control !py-3" placeholder="teacher@learncentric.com" autofocus />
        </div>

        <!-- Submit Button -->
        <div class="flex flex-col gap-3 mt-2 w-full">
            <button type="button" class="btn primary !py-3 w-full">Send Reset Link</button>
            <button type="button" routerLink="/auth/login" class="btn outline !py-3 hover:!bg-white w-full">Back to Login</button>
        </div>
    </form>
</div>
