<div class="flex flex-col items-center w-full">
    <h2 class="text-[32px] font-black text-slate-700 text-center mb-1">Create account</h2>
    <p class="text-[14px] text-gray-500 mb-8 font-medium text-center">Sign up and get 30 day free trial</p>

    <form class="w-full flex flex-col gap-5">
        
        <div class="form-group gap-1.5 p-0">
            <label for="first_name" class="text-[11px] font-bold text-gray-700 ml-1 uppercase tracking-wider">First name</label>
            <input type="text" class="form-control !py-3" placeholder="Amélie" autofocus />
        </div>

        <div class="form-group gap-1.5 p-0">
            <label for="last_name" class="text-[11px] font-bold text-gray-700 ml-1 uppercase tracking-wider">last name</label>
            <input type="text" class="form-control !py-3" placeholder="Laurent" />
        </div>

        <div class="form-group gap-1.5 p-0">
            <label for="email" class="text-[11px] font-bold text-gray-700 ml-1 uppercase tracking-wider">Email</label>
            <input type="email" id="email" class="form-control !py-3" placeholder="teacher@learncentric.com" />
        </div>

        <div class="form-group gap-1.5 p-0 relative">
            <label for="password" class="text-[11px] font-bold text-gray-700 ml-1 uppercase tracking-wider">Password</label>
            <input type="password" id="password" class="form-control !py-3" placeholder="****" />
            <!-- Eye icon -->
            <button type="button" class="absolute right-5 top-[34px] text-gray-400 hover:text-gray-600 focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                </svg>
            </button>
        </div>
        
        <!-- Submit Button -->
        <button type="button" routerLink="/app/dashboard" class="btn primary !py-3 mt-2">Sign Up</button>
    </form>
</div>
